<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="James Nanthuru">
    <meta name="description" content="Product review form for Nancienan Tech Consultancy">
    <title>Product Review Form</title>
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
</head>
<body>

    <main>
        <div class="glass-container">
            <!-- HEADER added here -->
            <header>
                <h1>Product Review</h1>
                <p>Share your experience with our tech products</p>
            </header>

            <form method="get" action="review.html" id="reviewForm">
                <!-- The Products Name -->
                <div class="form-group">
                    <label for="productName">Product Name</label>
                    <select id="productName" name="productName" required>
                        <option value="" disabled selected>Select a Product ...</option>
                    </select>
                </div>

                <!-- Overall Rating -->
                <div class="form-group">
                    <label>Overall Rating</label>
                    <div class="rating-group">
                        <input type="radio" id="star5" name="rating" value="5" required>
                        <label for="star5" title="5 stars">☆</label>
                        
                        <input type="radio" id="star4" name="rating" value="4" required>
                        <label for="star4" title="4 stars">☆</label>
                        
                        <input type="radio" id="star3" name="rating" value="3" required>
                        <label for="star3" title="3 stars">☆</label>
                        
                        <input type="radio" id="star2" name="rating" value="2" required>
                        <label for="star2" title="2 stars">☆</label>
                        
                        <input type="radio" id="star1" name="rating" value="1" required>
                        <label for="star1" title="1 star">☆</label>
                    </div>
                    <span class="rating-hint">(Click a star to rate)</span>
                </div>

                <!-- Date of Installation -->
                <div class="form-group">
                    <label for="installDate">Date of Installation</label>
                    <input type="date" id="installDate" name="installDate" required>
                </div>

                <!-- Useful Features (Checkboxes) -->
                <div class="form-group">
                    <label>Useful Features (Check all that apply)</label>
                    <div class="checkbox-group">
                        <input type="checkbox" id="feature1" name="features" value="easy-install">
                        <label for="feature1">Easy to Install</label>
                        
                        <input type="checkbox" id="feature2" name="features" value="user-friendly">
                        <label for="feature2">User-Friendly</label>
                        
                        <input type="checkbox" id="feature3" name="features" value="reliable">
                        <label for="feature3">Reliable Performance</label>
                        
                        <input type="checkbox" id="feature4" name="features" value="affordable">
                        <label for="feature4">Affordable Pricing</label>
                    </div>
                </div>

                <!-- Written Review -->
                <div class="form-group">
                    <label for="review">Written Review</label>
                    <textarea id="review" name="review" rows="4" placeholder="Tell us more about your experience... (optional)"></textarea>
                </div>

                <!-- User Name -->
                <div class="form-group">
                    <label for="userName">Your Name</label>
                    <input type="text" id="userName" name="userName" placeholder="Enter your name (optional)">
                </div>

                <!-- Submit Button -->
                <button type="submit" class="submit-btn">Submit Review</button>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; <span id="currentyear"></span> - James Nanthuru - Malawi</p>
        <p id="lastModified"></p>
    </footer>

</body>
</html>
